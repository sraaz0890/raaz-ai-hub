<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RAAZ AI HUB</title>

  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #090512;
      color: white;
      min-height: 100vh;
    }

    /* HEADER */

    .header {
      height: 65px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #241537;
      background: #0d0718;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .logo span {
      color: #9b5cff;
    }

    /* CHAT AREA */

    .chat-container {
      max-width: 900px;
      margin: auto;
      padding: 35px 18px 130px;
    }

    /* WELCOME */

    .welcome {
      text-align: center;
      margin-top: 80px;
      margin-bottom: 40px;
    }

    .welcome-icon {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      background: linear-gradient(
        135deg,
        #7c3aed,
        #a855f7
      );
      box-shadow: 0 0 35px rgba(139, 92, 246, 0.35);
    }

    .welcome h1 {
      margin-top: 22px;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .welcome p {
      margin: 0 auto;
      max-width: 600px;
      color: #aaa0b8;
      line-height: 1.6;
      font-size: 15px;
    }

    /* MESSAGES */

    #messages {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      display: flex;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .user .bubble {
      background: #6d28d9;
      border-bottom-right-radius: 5px;
    }

    .assistant .bubble {
      background: #15101f;
      border: 1px solid #292033;
      border-bottom-left-radius: 5px;
      color: #eee;
    }

    /* MARKDOWN */

    .bubble h1,
    .bubble h2,
    .bubble h3 {
      margin-top: 10px;
      margin-bottom: 8px;
    }

    .bubble h1 {
      font-size: 22px;
    }

    .bubble h2 {
      font-size: 19px;
    }

    .bubble h3 {
      font-size: 17px;
    }

    .bubble p {
      margin: 7px 0;
    }

    .bubble ul,
    .bubble ol {
      padding-left: 22px;
    }

    .bubble li {
      margin: 5px 0;
    }

    .bubble strong {
      color: #c084fc;
    }

    .bubble code {
      background: #0b0810;
      padding: 2px 6px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 13px;
    }

    .bubble pre {
      background: #08060c;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
      border: 1px solid #2a2035;
    }

    .bubble pre code {
      background: transparent;
      padding: 0;
    }

    .bubble blockquote {
      margin: 10px 0;
      padding-left: 12px;
      border-left: 3px solid #8b5cf6;
      color: #bdb4c7;
    }

    .bubble a {
      color: #a78bfa;
    }

    /* TYPING */

    #typing {
      display: none;
      align-items: center;
      gap: 5px;
      margin: 5px 0;
      padding: 12px 16px;
      width: fit-content;
      background: #15101f;
      border: 1px solid #292033;
      border-radius: 15px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a855f7;
      animation: blink 1.4s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: 0.3;
      }

      40% {
        opacity: 1;
      }
    }

    /* INPUT AREA */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 18px 18px;
      background: linear-gradient(
        transparent,
        #090512 30%
      );
      z-index: 20;
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px;
      background: #15101f;
      border: 1px solid #30243d;
      border-radius: 18px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.35);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      line-height: 1.5;
      min-height: 42px;
      max-height: 150px;
      padding: 10px;
      font-family: Arial, Helvetica, sans-serif;
    }

    textarea::placeholder {
      color: #777080;
    }

    #sendButton {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 13px;
      cursor: pointer;
      background: #7c3aed;
      color: white;
      font-size: 19px;
      transition: 0.2s;
    }

    #sendButton:hover {
      background: #8b5cf6;
      transform: translateY(-1px);
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .header {
        height: 58px;
        padding: 0 15px;
      }

      .logo {
        font-size: 18px;
      }

      .chat-container {
        padding: 25px 12px 125px;
      }

      .welcome {
        margin-top: 55px;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .welcome p {
        font-size: 14px;
      }

      .bubble {
        max-width: 90%;
        font-size: 14px;
      }

      .input-area {
        padding: 10px;
      }

      .input-box {
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <div class="header">
    <div class="logo">
      RAAZ <span>AI HUB</span>
    </div>
  </div>


  <!-- CHAT -->

  <main class="chat-container">

    <div class="welcome" id="welcome">

      <div class="welcome-icon">
        🤖
      </div>

      <h1>How can I help you?</h1>

      <p>
        Your AI tutor for all courses, learning, technology,
        coding, science, mathematics, English and more.
      </p>

    </div>


    <div id="messages"></div>


    <!-- TYPING -->

    <div id="typing">

      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>

    </div>

  </main>


  <!-- INPUT -->

  <div class="input-area">

    <div class="input-box">

      <textarea
        id="messageInput"
        placeholder="Ask anything about your course..."
        rows="1"
      ></textarea>

      <button id="sendButton">
        ➤
      </button>

    </div>

  </div>


  <script>

    const API_URL = "/api/chat";

    const messages = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const typing = document.getElementById("typing");
    const welcome = document.getElementById("welcome");


    /* ADD MESSAGE */

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;


      const bubble = document.createElement("div");

      bubble.className = "bubble";


      if (
        type === "assistant" &&
        typeof marked !== "undefined"
      ) {

        bubble.innerHTML = marked.parse(text);

      } else {

        bubble.textContent = text;

      }


      message.appendChild(bubble);

      messages.appendChild(message);


      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

    }


    /* SEND MESSAGE */

    async function sendMessage() {

      const text = messageInput.value.trim();


      if (!text) return;


      // Hide welcome screen

      welcome.style.display = "none";


      // User message

      addMessage(text, "user");


      // Clear input

      messageInput.value = "";

      messageInput.style.height = "42px";


      // Disable button

      sendButton.disabled = true;


      // Show typing

      typing.style.display = "flex";


      try {

        const response = await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error || "AI response failed."
          );

        }


        addMessage(
          data.reply ||
          "Sorry, I couldn't generate a response.",
          "assistant"
        );


      } catch (error) {

        console.error("Chat Error:", error);


        addMessage(
          "Sorry, something went wrong. Please try again.",
          "assistant"
        );

      } finally {

        typing.style.display = "none";

        sendButton.disabled = false;

        messageInput.focus();

      }

    }


    /* SEND BUTTON */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* ENTER KEY */

    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* AUTO RESIZE */

    messageInput.addEventListener(
      "input",
      function() {

        this.style.height = "42px";

        this.style.height =
          Math.min(
            this.scrollHeight,
            150
          ) + "px";

      }
    );

  </script>

</body>
</html>
