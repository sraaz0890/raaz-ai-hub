<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RAAZ AI — Chat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    :root {
      --bg: #07070b;
      --panel: #101017;
      --border: rgba(255,255,255,0.08);
      --purple: #9b5cff;
      --purple2: #743bd4;
      --text: #fff;
      --muted: #898994;
    }

    body {
      background:
        radial-gradient(circle at 50% -10%, rgba(130,65,230,.18), transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      height: 68px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(7,7,11,.78);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand span {
      color: #b98aff;
    }

    .back {
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: .2s;
    }

    .back:hover {
      color: white;
      border-color: rgba(155,92,255,.4);
    }

    .chat-container {
      width: 100%;
      max-width: 850px;
      margin: auto;
      min-height: calc(100vh - 68px);
      display: flex;
      flex-direction: column;
    }

    .welcome {
      text-align: center;
      padding: 55px 20px 25px;
    }

    .ai-icon {
      width: 58px;
      height: 58px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: rgba(155,92,255,.12);
      border: 1px solid rgba(155,92,255,.25);
      font-size: 27px;
      box-shadow: 0 0 35px rgba(155,92,255,.12);
    }

    .welcome h1 {
      margin-top: 18px;
      font-size: 30px;
    }

    .welcome p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    #messages {
      flex: 1;
      padding: 20px;
      padding-bottom: 150px;
    }

    .message {
      display: flex;
      margin-bottom: 20px;
      animation: appear .25s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      padding: 13px 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant .bubble {
      background: #111119;
      border: 1px solid var(--border);
      color: #e7e7ec;
      border-top-left-radius: 5px;
    }

    .user .bubble {
      background: linear-gradient(135deg, #8e51ed, #6d38cb);
      color: white;
      border-top-right-radius: 5px;
    }

    .typing {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 14px 17px;
      margin: 0 20px 15px;
      width: fit-content;
      background: #111119;
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9b5cff;
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: .4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px 18px 18px;
      background: linear-gradient(
        to top,
        #07070b 70%,
        transparent
      );
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 9px;
      padding: 8px;
      background: rgba(17,17,25,.94);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 17px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
      backdrop-filter: blur(15px);
    }

    textarea {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 11px 9px;
      font-size: 14px;
    }

    textarea::placeholder {
      color: #666672;
    }

    #send {
      width: 43px;
      height: 43px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(
        135deg,
        var(--purple),
        var(--purple2)
      );
      color
