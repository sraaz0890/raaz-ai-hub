<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PDF & Photo Tutor — RAAZ AI HUB</title>

<style>
:root{
  --bg:#07070b;
  --card:#12121b;
  --border:rgba(255,255,255,.09);
  --purple:#a866ff;
  --light:#c49aff;
  --text:#fff;
  --muted:#9999a5;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,rgba(132,65,255,.22),transparent 35%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  background:rgba(7,7,11,.82);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.07);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:1.5px;
}

.logo span{
  color:var(--light);
}

.back{
  color:var(--light);
  text-decoration:none;
  font-size:13px;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:55px 20px 80px;
}

.badge{
  display:inline-block;
  padding:8px 13px;
  border:1px solid rgba(155,92,255,.3);
  border-radius:30px;
  color:#c8a7ff;
  background:rgba(155,92,255,.08);
  font-size:11px;
  font-weight:700;
  letter-spacing:.8px;
}

h1{
  font-size:clamp(34px,7vw,58px);
  margin:18px 0 12px;
  letter-spacing:-2px;
}

h1 span{
  background:linear-gradient(90deg,#fff,#bd91ff,#9250ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.lead{
  color:var(--muted);
  line-height:1.7;
  max-width:700px;
}

.upload-card{
  margin-top:32px;
  background:rgba(18,18,27,.8);
  border:1px solid var(--border);
  border-radius:22px;
  padding:25px;
}

.drop-zone{
  border:2px dashed #3b2a50;
  border-radius:18px;
  padding:40px 20px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.drop-zone:hover{
  border-color:var(--purple);
  background:rgba(168,102,255,.05);
}

.icon{
  font-size:45px;
  margin-bottom:12px;
}

.drop-zone h2{
  font-size:20px;
  margin-bottom:8px;
}

.drop-zone p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

input[type=file]{
  display:none;
}

.file-name{
  margin-top:15px;
  padding:12px;
  background:#0d0b13;
  border:1px solid #292033;
  border-radius:12px;
  color:#c8a7ff;
  font-size:13px;
  display:none;
  word-break:break-word;
}

select,
textarea,
button{
  width:100%;
  border:1px solid #30243d;
  background:#15101f;
  color:#fff;
  border-radius:12px;
  padding:13px;
  margin-top:12px;
  font:inherit;
  outline:none;
}

select:focus,
textarea:focus{
  border-color:#8d54e8;
}

button{
  background:linear-gradient(135deg,#a866ff,#7540dc);
  border:0;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

.status{
  margin-top:15px;
  color:#aaa;
  font-size:13px;
  text-align:center;
  line-height:1.6;
}

.result{
  margin-top:22px;
  padding:20px;
  border-radius:15px;
  background:#0d0b13;
  border:1px solid #292033;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
  display:none;
}

.error{
  color:#ff9b9b;
}

@media(max-width:650px){

  header{
    height:62px;
    padding:0 16px;
  }

  .logo{
    font-size:17px;
  }

  .wrap{
    padding:40px 15px 70px;
  }

  .upload-card{
    padding:18px;
  }

  .drop-zone{
    padding:32px 15px;
  }
}
</style>
</head>

<body>

<header>

<div class="logo">
RAAZ <span>AI HUB</span>
</div>

<a class="back" href="/">
← Home
</a>

</header>


<main class="wrap">

<span class="badge">
📚 PDF & PHOTO TUTOR
</span>

<h1>
Learn From Your <span>Books</span>
</h1>

<p class="lead">
Upload a PDF or a photo of your study material and let RAAZ AI
summarise, explain and turn it into useful study material.
</p>


<div class="upload-card">

<div
class="drop-zone"
onclick="document.getElementById('fileInput').click()"
>

<div class="icon">📄</div>

<h2>
Upload PDF or Photo
</h2>

<p>
Tap here to choose PDF, JPG, JPEG, PNG or WEBP.
</p>

<input
id="fileInput"
type="file"
accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp"
onchange="fileSelected()"
>

</div>


<div id="fileName" class="file-name"></div>


<select id="action">

<option value="summary">
🧠 Summarise this material
</option>

<option value="explain">
📚 Explain it in simple language
</option>

<option value="notes">
📝 Make study notes
</option>

<option value="important">
🎯 Find important points
</option>

<option value="questions">
❓ Create questions and answers
</option>

<option value="exam">
🔥 Prepare exam-focused revision
</option>

</select>


<textarea
id="instruction"
rows="4"
placeholder="Optional: Tell RAAZ AI what you want to know..."
></textarea>


<button
id="analyzeBtn"
onclick="analyzeFile()"
disabled
>
🚀 Analyze with RAAZ AI
</button>


<div id="status" class="status"></div>

<div id="result" class="result"></div>

</div>

</main>


<script>

let selectedFile = null;


/* =========================
   FILE SELECTED
========================= */

function fileSelected(){

  const input =
    document.getElementById("fileInput");

  const file =
    input.files[0];

  const nameBox =
    document.getElementById("fileName");

  const button =
    document.getElementById("analyzeBtn");

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");


  result.style.display = "none";
  status.textContent = "";


  if(!file){

    selectedFile = null;

    nameBox.style.display = "none";

    button.disabled = true;

    return;
  }


  const allowedTypes = [
    "application/pdf",
    "image/jpeg",
    "image/png",
    "image/webp"
  ];


  if(!allowedTypes.includes(file.type)){

    selectedFile = null;

    nameBox.style.display = "block";

    nameBox.textContent =
      "❌ Unsupported file type.";

    button.disabled = true;

    return;
  }


  /* 20 MB frontend check */

  if(file.size > 20 * 1024 * 1024){

    selectedFile = null;

    nameBox.style.display = "block";

    nameBox.textContent =
      "❌ File is larger than 20 MB.";

    button.disabled = true;

    return;
  }


  selectedFile = file;

  nameBox.style.display = "block";

  nameBox.textContent =
    "📎 Selected: " +
    file.name +
    " (" +
    formatSize(file.size) +
    ")";

  button.disabled = false;

}


/* =========================
   FORMAT FILE SIZE
========================= */

function formatSize(bytes){

  if(bytes < 1024 * 1024){

    return (bytes / 1024).toFixed(1) + " KB";

  }

  return (bytes / (1024 * 1024)).toFixed(2) + " MB";

}


/* =========================
   ANALYZE FILE
========================= */

async function analyzeFile(){

  if(!selectedFile){

    return;
  }


  const action =
    document.getElementById("action").value;

  const instruction =
    document.getElementById("instruction").value.trim();

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const button =
    document.getElementById("analyzeBtn");


  button.disabled = true;

  button.textContent =
    "⏳ RAAZ AI is reading...";

  status.textContent =
    "Reading your study material. Please wait...";

  result.style.display = "none";

  result.classList.remove("error");


  try{

    const formData = new FormData();

    formData.append(
      "file",
      selectedFile
    );

    formData.append(
      "action",
      action
    );

    formData.append(
      "instruction",
      instruction
    );


    const response =
      await fetch(
        "/api/document-tutor",
        {
          method:"POST",
          body:formData
        }
      );


    let data;

    try{

      data = await response.json();

    }catch(e){

      throw new Error(
        "Server returned an invalid response."
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "Document analysis failed."
      );

    }


    result.style.display = "block";

    result.textContent =
      data.reply ||
      "RAAZ AI did not return a response.";

    status.textContent =
      "✅ Analysis completed" +
      (data.model
        ? " using " + data.model
        : "") +
      ".";


  }catch(error){

    result.style.display = "block";

    result.classList.add("error");

    result.textContent =
      "❌ " +
      (error.message ||
      "Something went wrong.") +
      "\n\nPlease try again.";

    status.textContent = "";

  }finally{

    button.disabled = false;

    button.textContent =
      "🚀 Analyze with RAAZ AI";

  }

}

</script>

</body>
</html>
