<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Useful Tools — RAAZ AI HUB</title>
<style>
:root{--bg:#07070b;--card:#12121b;--border:rgba(255,255,255,.09);--light:#c49aff;--text:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(132,65,255,.2),transparent 35%),var(--bg);color:var(--text);min-height:100vh}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:rgba(7,7,11,.8);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:800;letter-spacing:1.5px}.logo span{color:var(--light)}
.back{color:#c49aff;text-decoration:none;font-size:13px}
.wrap{max-width:1000px;margin:auto;padding:55px 20px 80px}
.badge{display:inline-block;padding:8px 13px;border:1px solid rgba(155,92,255,.3);border-radius:30px;color:#c8a7ff;background:rgba(155,92,255,.08);font-size:11px;font-weight:700;letter-spacing:.8px}
h1{font-size:clamp(34px,7vw,58px);margin:18px 0 12px;letter-spacing:-2px}
h1 span{background:linear-gradient(90deg,#fff,#bd91ff,#9250ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lead{color:#9999a5;line-height:1.7;max-width:700px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:32px}
.card{background:rgba(18,18,27,.75);border:1px solid var(--border);border-radius:20px;padding:24px}
.card h2{font-size:20px;margin-bottom:8px}.card p{color:#92929f;font-size:13px;line-height:1.6}
select,input,textarea,button{width:100%;border:1px solid #30243d;background:#15101f;color:#fff;border-radius:12px;padding:13px;margin-top:10px;font:inherit;outline:none}
button{background:linear-gradient(135deg,#a866ff,#7540dc);border:0;font-weight:700;cursor:pointer}
.result{margin-top:15px;padding:15px;border-radius:13px;background:#0d0b13;border:1px solid #292033;line-height:1.6;white-space:pre-wrap}
@media(max-width:650px){header{height:62px;padding:0 16px}.logo{font-size:17px}.grid{grid-template-columns:1fr}.wrap{padding:40px 15px 70px}}
</style>
</head>
<body>
<header><div class="logo">RAAZ <span>AI HUB</span></div><a class="back" href="/">← Home</a></header>
<main class="wrap">
<span class="badge">⚡ USEFUL TOOLS</span>
<h1>Everyday <span>Tools</span></h1>
<p class="lead">Simple utilities that work directly in your browser.</p>
<div class="grid">
<div class="card"><h2>🧮 Calculator</h2><input id="calc" placeholder="Example: 25*4+10"><button onclick="calculate()">Calculate</button><div id="calcOut" class="result" style="display:none"></div></div>
<div class="card"><h2>📊 Percentage</h2><input id="part" type="number" placeholder="Value"><input id="total" type="number" placeholder="Total"><button onclick="percent()">Calculate %</button><div id="perOut" class="result" style="display:none"></div></div>
<div class="card"><h2>🔢 Word Counter</h2><textarea id="words" rows="5" placeholder="Type or paste text"></textarea><div id="wordOut" class="result">Words: 0 | Characters: 0</div></div>
<div class="card"><h2>📏 Unit Converter</h2><input id="km" type="number" placeholder="Kilometres"><button onclick="convert()">Convert to metres</button><div id="unitOut" class="result" style="display:none"></div></div>
</div></main>
<script>function calculate(){
const o=document.getElementById('calcOut');const v=document.getElementById('calc').value.trim();
if(!/^[0-9+\\-*/().% ]+$/.test(v)){o.style.display='block';o.textContent='Invalid calculation.';return}
try{o.style.display='block';o.textContent='Result: '+Function('return ('+v+')')()}catch(e){o.style.display='block';o.textContent='Invalid calculation.'}
}
function percent(){const a=+document.getElementById('part').value,b=+document.getElementById('total').value,o=document.getElementById('perOut');o.style.display='block';o.textContent=b?'Result: '+((a/b)*100).toFixed(2)+'%':'Enter a valid total.'}
document.getElementById('words').addEventListener('input',function(){const t=this.value;document.getElementById('wordOut').textContent='Words: '+(t.trim()?t.trim().split(/\\s+/).length:0)+' | Characters: '+t.length})
function convert(){const v=+document.getElementById('km').value,o=document.getElementById('unitOut');o.style.display='block';o.textContent='Metres: '+(v*1000)}
</script>
</body>
</html>
